version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /runtime
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /runtime]
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    # CI does not build the images, so a major base image upgrade (Python, JRE, Node) is checked by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
