name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, so vulnerabilities published after a merge are caught too.
  schedule:
    - cron: '0 0 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    services:
      # Only the ledger fault-injection tests use this (LEDGER_TEST_DATABASE_URL); every other
      # test runs with no database configured, same as before.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      LEDGER_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Governance evaluation summary
        if: always()
        run: python -m evals.run --summary >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime/pyproject.toml
      - run: pip install -e "runtime[dev]"
      - run: playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/e2e.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    # Known HIGH/CRITICAL vulnerabilities that already have a fixed version fail the build.
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.75.0
      TRIVY_ARGS: --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew bootJar -x test
      - name: Java libraries (the jar)
        run: docker run --rm -v "$PWD:/src" $TRIVY rootfs $TRIVY_ARGS /src/build/libs
      - name: Frontend (package-lock.json)
        run: docker run --rm -v "$PWD:/src" $TRIVY fs $TRIVY_ARGS /src/frontend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Runtime (Python)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ./runtime
          pip-audit --skip-editable
