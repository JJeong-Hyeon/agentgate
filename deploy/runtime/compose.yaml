# Runtime EC2: agent runtime + Ollama. Synced to ~/agentgate-runtime by scripts/deploy-runtime.sh,
# next to a copy of runtime/ and a .env (see .env.example in this directory).
services:
  runtime:
    build: ./runtime
    env_file: .env
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
    ports:
      - '8000:8000'
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: 'ollama/ollama:latest'
    volumes:
      - 'ollama-models:/root/.ollama'
    restart: unless-stopped

volumes:
  ollama-models:
