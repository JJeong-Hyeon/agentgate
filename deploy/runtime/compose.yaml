# Runtime EC2: agent runtime, plus Ollama unless the runtime uses an external LLM server.
# Synced to ~/agentgate-runtime by scripts/deploy-runtime.sh, next to a copy of runtime/ and a .env
# (see .env.example in this directory). The Ollama service only starts with --profile ollama.
services:
  runtime:
    build: ./runtime
    env_file: .env
    environment:
      # An LLM_BASE_URL in .env (e.g. vLLM on a GPU server) replaces the bundled Ollama.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
    ports:
      - '8000:8000'
    depends_on:
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped
  ollama:
    image: 'ollama/ollama:latest'
    profiles: ['ollama']
    volumes:
      - 'ollama-models:/root/.ollama'
    restart: unless-stopped

volumes:
  ollama-models:
