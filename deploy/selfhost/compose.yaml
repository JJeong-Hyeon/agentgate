# AgentGate on a single server: console/API, agent runtime, PostgreSQL, Redis and Caddy (HTTPS).
# The model server (Ollama or vLLM) is not included; point LLM_BASE_URL at yours. See docs/SELF_HOSTING.md.
#   cp .env.example .env   # fill in
#   docker compose up -d --build
name: agentgate

services:
  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      AGENTGATE_DOMAIN: ${AGENTGATE_DOMAIN:?set AGENTGATE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ../..
    # AGENTGATE_VERSION (e.g. 0.1.0) uses the published image; empty builds from this checkout.
    image: ${AGENTGATE_IMAGE:-ghcr.io/jjeong-hyeon/agentgate}:${AGENTGATE_VERSION:-local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentgate
      SPRING_DATASOURCE_USERNAME: agentgate
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      AGENTGATE_ADMIN_USERNAME: ${AGENTGATE_ADMIN_USERNAME:-admin}
      AGENTGATE_ADMIN_PASSWORD: ${AGENTGATE_ADMIN_PASSWORD:?set AGENTGATE_ADMIN_PASSWORD in .env}
      AGENTGATE_RUNTIME_BASE_URL: http://runtime:8000
      AGENTGATE_RUNTIME_TOKEN: ${RUNTIME_TOKEN:?set RUNTIME_TOKEN in .env}
      AGENTGATE_SECRET_KEY: ${AGENTGATE_SECRET_KEY:?set AGENTGATE_SECRET_KEY in .env}
      AGENTGATE_PUBLIC_URL: https://${AGENTGATE_DOMAIN}
      # The console is served over HTTPS (Caddy): keep the session cookie off plain HTTP.
      AGENTGATE_SESSION_COOKIE_SECURE: ${AGENTGATE_SESSION_COOKIE_SECURE:-true}
      AGENTGATE_SESSION_TIMEOUT: ${AGENTGATE_SESSION_TIMEOUT:-PT8H}
      AGENTGATE_APPROVAL_TTL: ${AGENTGATE_APPROVAL_TTL:-PT24H}
      AGENTGATE_EXECUTION_RETENTION: ${AGENTGATE_EXECUTION_RETENTION:-P90D}
      AGENTGATE_LOGIN_STORE: ${AGENTGATE_LOGIN_STORE:-redis}
      AGENTGATE_LOGIN_MAX_FAILURES: ${AGENTGATE_LOGIN_MAX_FAILURES:-5}
      AGENTGATE_LOGIN_MAX_FAILURES_PER_IP: ${AGENTGATE_LOGIN_MAX_FAILURES_PER_IP:-20}
      AGENTGATE_LOGIN_LOCK_DURATION: ${AGENTGATE_LOGIN_LOCK_DURATION:-PT15M}
      AGENTGATE_NOTIFY_WEBHOOK_URL: ${AGENTGATE_NOTIFY_WEBHOOK_URL:-}
      AGENTGATE_NOTIFY_WEBHOOK_FORMAT: ${AGENTGATE_NOTIFY_WEBHOOK_FORMAT:-SLACK}
      AGENTGATE_NOTIFY_WEBHOOK_SECRET: ${AGENTGATE_NOTIFY_WEBHOOK_SECRET:-}
      AGENTGATE_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      AGENTGATE_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      AGENTGATE_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      AGENTGATE_MEMORY_MIN_SCORE: ${MEMORY_MIN_SCORE:-0.3}
    # Embedding servers on this host or behind scripts/model-tunnel.sh (Linux needs the explicit mapping).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Ready once Spring has started (DB migrated), so `up --wait` and Caddy wait for it.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  runtime:
    build: ../../runtime
    image: ${AGENTGATE_RUNTIME_IMAGE:-ghcr.io/jjeong-hyeon/agentgate-runtime}:${AGENTGATE_VERSION:-local}
    environment:
      AGENTGATE_BASE_URL: http://app:8080
      AGENTGATE_AGENT_ID: runtime-agent
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?set RUNTIME_TOKEN in .env}
      RUNTIME_DATABASE_URL: postgresql://agentgate:${POSTGRES_PASSWORD}@postgres:5432/agentgate
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in .env}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TOOL_CALLING: ${LLM_TOOL_CALLING:-native}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_PARALLEL_TOOL_CALLS: ${LLM_PARALLEL_TOOL_CALLS:-false}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-false}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  postgres:
    # PostgreSQL 17 with pgvector, for semantic search over agent memories.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentgate -d agentgate']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  # Optional: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ['monitoring']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  # The dashboard file is written for Grafana's import screen (data source chosen at import);
  # provisioning has no such step, so point it at the provisioned data source first.
  grafana-dashboards:
    image: busybox:1.36
    profiles: ['monitoring']
    command: ['sh', '-c', 'sed "s/\$${DS_PROMETHEUS}/prometheus/g" /src/agentgate-dashboard.json > /dashboards/agentgate.json']
    volumes:
      - ../../infra/grafana/agentgate-dashboard.json:/src/agentgate-dashboard.json:ro
      - grafana-dashboards:/dashboards

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ['monitoring']
    environment:
      GF_SERVER_ROOT_URL: https://${AGENTGATE_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      # Empty → Grafana's default (admin), which it makes you change at first sign-in.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      grafana-dashboards:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  prometheus-data:
  grafana-data:
  grafana-dashboards:
