# DEVELOPMENT ONLY: fixed demo passwords, a default runtime token, ports published on this machine.
# Run it for local work and tests, never as a deployment. For servers use deploy/selfhost (docs/SELF_HOSTING.md)
# or the AWS setup (docs/DEPLOYMENT.md): secrets are required there and nothing is published but HTTPS.
services:
  postgres:
    # pgvector: semantic search over agent memories (optional; plain PostgreSQL falls back to keywords).
    image: 'pgvector/pgvector:pg17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1::5432'
  redis:
    image: 'redis:7'
    ports:
      - '127.0.0.1::6379'
  prometheus:
    image: 'prom/prometheus:v2.55.1'
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml'
    ports:
      - '127.0.0.1:9090:9090'
  grafana:
    image: 'grafana/grafana:11.3.1'
    ports:
      - '127.0.0.1:3000:3000'
  runtime:
    build: ./runtime
    profiles: ['runtime']
    environment:
      - 'AGENTGATE_BASE_URL=http://host.docker.internal:8080'
      - 'AGENTGATE_API_KEY=${AGENTGATE_API_KEY:-}'
      - 'RUNTIME_TOKEN=${RUNTIME_TOKEN:-dev-runtime-token}'
      - 'LLM_BASE_URL=http://ollama:11434/v1'
      - 'LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}'
      - 'RUNTIME_DATABASE_URL=postgresql://myuser:secret@postgres:5432/mydatabase'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      - postgres
      - ollama
  ollama:
    image: 'ollama/ollama:latest'
    profiles: ['runtime']
    volumes:
      - 'ollama-models:/root/.ollama'
    ports:
      - '127.0.0.1:11434:11434'

volumes:
  ollama-models:
