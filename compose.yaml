services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
  prometheus:
    image: 'prom/prometheus:latest'
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml'
    ports:
      - '9090:9090'
  grafana:
    image: 'grafana/grafana:latest'
    ports:
      - '3000:3000'
  runtime:
    build: ./runtime
    profiles: ['runtime']
    environment:
      - 'AGENTGATE_BASE_URL=http://host.docker.internal:8080'
      - 'AGENTGATE_API_KEY=${AGENTGATE_API_KEY:-}'
      - 'REPORT_URL=${REPORT_URL:-}'
      - 'RUNTIME_TOKEN=${RUNTIME_TOKEN:-dev-runtime-token}'
      - 'LLM_BASE_URL=http://ollama:11434/v1'
      - 'LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}'
      - 'RUNTIME_DATABASE_URL=postgresql://myuser:secret@postgres:5432/mydatabase'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - ollama
  ollama:
    image: 'ollama/ollama:latest'
    profiles: ['runtime']
    volumes:
      - 'ollama-models:/root/.ollama'
    ports:
      - '11434:11434'

volumes:
  ollama-models:
