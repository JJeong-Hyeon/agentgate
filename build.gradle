plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.agentgate'
version = '0.0.1-SNAPSHOT'
description = 'agentgate'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Security patches newer than Spring Boot 4.1.1 manages; drop when Boot catches up.
// Tomcat: CVE-2026-65182, CVE-2026-65905, CVE-2026-68525. Jackson: CVE-2026-89407, -89425, -68497, -91776, -91777.
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.7'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'com.h2database:h2'
    // Checks metric names as Prometheus exposes them (the Grafana dashboard queries those).
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// `./gradlew bootJar -PwithFrontend` bundles the React UI (frontend/) into the jar as static resources.
def frontendDir = layout.projectDirectory.dir('frontend')

tasks.register('buildFrontend', Exec) {
    description = 'Builds the frontend with npm.'
    workingDir frontendDir
    commandLine 'sh', '-c', 'npm ci && npm run build'
    inputs.dir(frontendDir.dir('src'))
    inputs.files(frontendDir.file('package.json'), frontendDir.file('package-lock.json'), frontendDir.file('index.html'))
    outputs.dir(frontendDir.dir('dist'))
}

if (project.hasProperty('withFrontend')) {
    tasks.named('processResources') {
        dependsOn 'buildFrontend'
        from(frontendDir.dir('dist')) {
            into 'static'
        }
    }
}
