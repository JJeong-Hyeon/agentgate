scrape_configs:
  - job_name: agentgate
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

# Grafana Cloud로 메트릭을 내보내려면 아래 주석을 풀고 본인의 remote_write URL/자격증명으로 채운다.
# Grafana Cloud 콘솔 > Connections > Prometheus에서 "Remote Write" 엔드포인트/username/API 키를 확인할 것.
# 이 값들은 비밀이므로 실제 값을 이 파일에 커밋하지 말 것 — 로컬에서만 채워서 사용.
#
# remote_write:
#   - url: https://<your-stack>.grafana.net/api/prom/push
#     basic_auth:
#       username: "<grafana cloud instance id>"
#       password: "<grafana cloud api key>"
