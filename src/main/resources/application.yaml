spring:
  application:
    name: agentgate
  jpa:
    hibernate:
      # The schema is owned by Flyway (db/migration); Hibernate only checks that it matches the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Databases created before Flyway (by ddl-auto) have tables but no history; V1 is written to run on them.
    baseline-on-migrate: true
    baseline-version: 0

server:
  # Trust X-Forwarded-* from reverse proxies on private networks (ALB, Caddy), so requests that reached the
  # proxy over HTTPS are treated as secure (HSTS, redirect URLs).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

agentgate:
  admin:
    # 로컬 개발용 기본값. 운영 배포 전 반드시 환경변수(AGENTGATE_ADMIN_USERNAME/AGENTGATE_ADMIN_PASSWORD)로 override할 것.
    username: admin
    password: changeme
  login:
    # 같은 아이디 + 같은 IP에서 이만큼 연속 실패하면 lock-duration 동안 그 조합의 로그인을 막는다(429).
    max-failures: ${AGENTGATE_LOGIN_MAX_FAILURES:5}
    # 한 IP에서 아이디와 상관없이 lock-duration 안에 이만큼 실패하면 그 IP의 로그인을 막는다.
    max-failures-per-ip: ${AGENTGATE_LOGIN_MAX_FAILURES_PER_IP:20}
    lock-duration: ${AGENTGATE_LOGIN_LOCK_DURATION:PT15M}
  retention:
    # 끝난 실행(완료 / 중단 / 실패)의 기록과 Runtime checkpoint를 이 기간이 지나면 지운다. P0D면 지우지 않는다.
    # 감사 로그와 승인 기록은 지우지 않는다.
    executions: ${AGENTGATE_EXECUTION_RETENTION:P90D}
    check-delay: PT1H
  approval:
    # PENDING 상태로 이 시간이 지난 승인 요청은 EXPIRED 처리되고, 대기 중인 실행은 거절과 동일하게 진행된다.
    ttl: ${AGENTGATE_APPROVAL_TTL:PT24H}
    expiry-check-delay: PT1M
  # 콘솔의 외부 접속 주소(예: https://agentgate.example.com). 알림에 승인 화면 링크를 넣을 때 쓴다.
  public-url: ${AGENTGATE_PUBLIC_URL:}
  notifications:
    webhook:
      # 승인 요청이 생기면 이 주소로 알림을 보낸다. 비워두면 알림을 보내지 않는다.
      url: ${AGENTGATE_NOTIFY_WEBHOOK_URL:}
      # SLACK: {"text": ...} (Slack/Mattermost/Dooray) / JSON: 승인 요청 전체
      format: ${AGENTGATE_NOTIFY_WEBHOOK_FORMAT:SLACK}
      # JSON 포맷에서 설정하면 본문의 HMAC-SHA256을 X-AgentGate-Signature: sha256=<hex>로 보낸다.
      secret: ${AGENTGATE_NOTIFY_WEBHOOK_SECRET:}
    retry-delay: PT30S
  memory:
    embedding:
      # OpenAI 호환 임베딩 서버(예: vLLM으로 bge-m3 서빙, http://<서버>:8001/v1). 비우면 기억 검색은 키워드로만 한다.
      # 의미 검색에는 PostgreSQL에 pgvector 확장도 필요하다.
      base-url: ${AGENTGATE_EMBEDDING_BASE_URL:}
      model: ${AGENTGATE_EMBEDDING_MODEL:}
      api-key: ${AGENTGATE_EMBEDDING_API_KEY:}
    # 의미 검색 결과로 인정할 최소 코사인 유사도. 모델마다 분포가 달라 조정이 필요할 수 있다.
    min-score: ${AGENTGATE_MEMORY_MIN_SCORE:0.3}
    # 저장할 때 이 이상 비슷한 기존 기억을 Agent에게 알려 대체할지 판단하게 한다(자동 병합은 하지 않음).
    similar-score: ${AGENTGATE_MEMORY_SIMILAR_SCORE:0.85}
    backfill-delay: PT5M
  runtime:
    # Python agent runtime (runtime/). 비워두면 승인 결정 후 실행 재개 호출을 하지 않는다.
    base-url: ${AGENTGATE_RUNTIME_BASE_URL:}
    # Runtime의 RUNTIME_TOKEN과 같은 값. base-url을 설정했다면 필수.
    token: ${AGENTGATE_RUNTIME_TOKEN:}
    retry-delay: PT30S
  secrets:
    # AES-256 key (32 bytes, Base64) for credentials stored in the database, e.g. MCP server headers.
    # Required in prod (openssl rand -base64 32); empty uses a development key.
    key: ${AGENTGATE_SECRET_KEY:}
