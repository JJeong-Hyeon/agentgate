spring:
  application:
    name: agentgate
  datasource:
    url: jdbc:h2:mem:agentgate;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    # Migrations are PostgreSQL SQL; they are tested against PostgreSQL in FlywayMigrationTest.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cache:
    type: simple

server:
  # Same as the main application.yaml, which this file replaces in tests.
  forward-headers-strategy: native

agentgate:
  admin:
    username: test-admin
    password: test-password
